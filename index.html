<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Solar Installer Cape Town | Coming Soon</title>

  <meta
    name="description"
    content="Solar installation services in Cape Town. Our new website is coming soon."
  >

  <meta name="robots" content="index, follow">

  <link
    rel="canonical"
    href="https://solarinstallercapetown.co.za/"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #172026;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      padding: 70px 30px;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(36px, 7vw, 64px);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    h1 span {
      color: #f5a623;
    }

    p {
      max-width: 600px;
      margin: 0 auto 30px;
      color: #5f6b72;
      font-size: 18px;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      background: #fff4d6;
      color: #9a6500;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: #f5a623;
      color: #111;
    }

    .btn-secondary {
      border: 1px solid #d7dce0;
      color: #172026;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    footer {
      margin-top: 45px;
      font-size: 14px;
      color: #89939a;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">☀️</div>

    <div class="badge">
      WEBSITE COMING SOON
    </div>

    <h1>
      Solar Installer <span>Cape Town</span>
    </h1>

    <p>
      We're building a new website to help homeowners and businesses
      find reliable solar installation, solar panels, batteries and
      inverter solutions in Cape Town.
    </p>

    <div class="buttons">

      <a
        class="btn btn-primary"
        href="https://wa.me/"
        target="_blank"
        rel="noopener"
      >
        Get a Solar Quote
      </a>

      <a
        class="btn btn-secondary"
        href="tel:"
      >
        Call Us
      </a>

    </div>

    <footer>
      © 2026 Solar Installer Cape Town. All rights reserved.
    </footer>

  </main>

</body>
</html>
